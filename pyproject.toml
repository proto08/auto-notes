[project]
name = "mnemo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.7.0",
    "cryptography>=46.0.7",
    "fastapi>=0.162.2",
    "faster-whisper>=1.2.1",
    "filelock>=4.2.10",
    "ollama>=0.6.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.9.1",
    "pymysql>=1.2.4",
    "pytest>=9.0.3",
    "python-multipart>=0.0.26",
    "pywhispercpp>=1.4.1",
    "sqlalchemy>=2.0.49",
    "torch>=2.11.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff.lint]
# pydantic の Generic[_T] は PEP 695 構文へ移行せずに残す
ignore = ["UP046"]
